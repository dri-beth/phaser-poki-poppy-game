[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Phaser/Vite SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ensure the entry HTML is always revalidated so new deploys show up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed Vite assets can be cached aggressively.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
